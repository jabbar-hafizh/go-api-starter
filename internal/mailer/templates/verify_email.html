<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:20px;font-weight:600;">Confirm your email</h1>

          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#444;">
            You created an account with this address. Confirm it to finish signing up.
          </p>

          <a href="{{ .Link }}"
             style="display:inline-block;padding:12px 24px;background:#1a1a1a;color:#ffffff;text-decoration:none;border-radius:6px;font-size:15px;font-weight:500;">
            Confirm email
          </a>

          <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#666;">
            Or paste this into your browser:<br />
            <span style="word-break:break-all;color:#444;">{{ .Link }}</span>
          </p>

          <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#666;">
            The link stops working in {{ .ExpiresIn }}. If you did not create this
            account, ignore this message and nothing happens.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
