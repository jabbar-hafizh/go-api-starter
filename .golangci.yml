version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused

  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      # Cognitive, not cyclomatic: deep nesting is what loses the reader,
      # not the number of branches.
      min-complexity: 20
    cyclop:
      max-complexity: 15
    errcheck:
      check-type-assertions: true

  exclusions:
    generated: lax
    paths:
      - internal/db/gen
      - internal/openapi
    rules:
      # A table-driven test grows with the number of cases, which is a list and
      # not the nesting these linters are meant to catch.
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - gosec
      # A doc comment on every exported symbol is right for a library. This is
      # an application, and on methods that just satisfy an interface the
      # comment only repeats the interface. Comments stay where they earn it.
      - linters:
          - revive
        text: "^exported:"

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - internal/db/gen
      - internal/openapi
