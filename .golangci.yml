version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused

  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      # Cognitive, not cyclomatic: deep nesting is what loses the reader,
      # not the number of branches.
      min-complexity: 20
    cyclop:
      max-complexity: 15
    errcheck:
      check-type-assertions: true

  exclusions:
    generated: lax
    paths:
      - internal/db/gen
      - internal/openapi
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - gosec

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - internal/db/gen
      - internal/openapi
