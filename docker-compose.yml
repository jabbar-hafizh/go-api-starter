services:
  postgres:
    image: postgres:16-alpine
    container_name: go-api-starter-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, `make db-up` returns before Postgres accepts connections
      # and the first migration fails for a misleading reason.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
