services:
  api:
    build:
      context: .
    container_name: go-api-starter-api
    depends_on:
      postgres:
        condition: service_healthy
    # One source of configuration. Copy .env.example to .env first.
    env_file:
      - .env
    environment:
      # The only value that has to differ inside the network: Postgres answers
      # to its service name here, and localhost would be this container.
      POSTGRES_DSN: postgres://app:app@postgres:5432/app?sslmode=disable
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no shell, so the binary probes itself. Without this,
      # `up --wait` calls a crash-looping container healthy.
      test: ["CMD", "/api", "-health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: go-api-starter-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, `make db-up` returns before Postgres accepts connections
      # and the first migration fails for a misleading reason.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
