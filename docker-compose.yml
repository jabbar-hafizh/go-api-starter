services:
  api:
    build:
      context: .
    container_name: go-api-starter-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_LOG_LEVEL: debug
      HTTP_PORT: "8080"
      # Inside the compose network Postgres answers to its service name.
      # localhost here would be the api container itself.
      POSTGRES_DSN: postgres://app:app@postgres:5432/app?sslmode=disable
      VALIDATE_SPEC: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: go-api-starter-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, `make db-up` returns before Postgres accepts connections
      # and the first migration fails for a misleading reason.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
